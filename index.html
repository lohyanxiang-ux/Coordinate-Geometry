<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coordinate Geometry Practice</title>
    <style>
        /* CSS Reset & Core iPad Optimization */
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0; padding: 0; display: flex; flex-direction: column; 
            height: 100vh; height: 100dvh; background-color: #f4f6f8; overflow: hidden;
        }

        /* Top Navigation / Header */
        header {
            background-color: #2c3e50; color: white; padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.2em; font-weight: bold; z-index: 200; gap: 10px;
        }

        .header-btn {
            background: #3498db; border: none; color: white; padding: 8px 16px;
            border-radius: 8px; min-height: 44px; font-size: 1rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 3px 0 #2980b9;
        }
        .header-btn:active { transform: translateY(3px); box-shadow: none; }
        .header-btn.secondary { background: rgba(255,255,255,0.2); box-shadow: none; }

        .score-board { display: flex; gap: 15px; font-size: 0.9em; min-width: 150px; justify-content: flex-end;}
        .score-correct { color: #2ecc71; }
        .score-wrong { color: #e74c3c; }

        /* Main Layout wrappers */
        #menu-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex-grow: 1; padding: 20px;
        }
        .menu-btn {
            background-color: #3498db; color: white; border: none; border-radius: 12px;
            padding: 20px; margin: 10px 0; width: 100%; max-width: 500px;
            font-size: 1.2em; font-weight: bold; box-shadow: 0 4px 0 #2980b9; cursor: pointer; min-height: 60px;
        }
        .menu-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 #2980b9; }
        .menu-btn:disabled { background-color: #95a5a6; box-shadow: 0 4px 0 #7f8c8d; cursor: not-allowed; opacity: 0.8;}

        #app-screen { display: flex; flex-direction: row; flex-grow: 1; height: calc(100vh - 64px); height: calc(100dvh - 64px); position: relative; }
        .hidden { display: none !important; }

        /* Math Formatting Classes */
        .math-expr { font-family: Cambria, 'Times New Roman', serif; font-size: 1.3em; }
        .math-var { font-style: italic; }
        
        /* TALL BRACKET CSS */
        .tall-bracket {
            display: inline-block;
            transform: scale(1, 2.5);
            transform-origin: center;
            margin: 0 4px;
            font-weight: 300;
            vertical-align: middle;
            color: #2c3e50;
        }

        .fraction-wrapper { display: inline-flex; align-items: center; vertical-align: middle; gap: 2px; }
        .negative-sign { font-size: 1.2em; font-weight: bold; margin-right: 4px; }
        .fraction { display: inline-flex; flex-direction: column; vertical-align: middle; }
        .frac { display: inline-flex; flex-direction: column; vertical-align: middle; margin: 0 6px; font-size: 0.9em; }
        .frac-num { border-bottom: 2px solid #2c3e50; padding: 4px 8px; text-align: center; display: block; white-space: nowrap;}
        .frac-den { padding: 4px 8px; text-align: center; display: block; white-space: nowrap;}
        .frac-num.active, .frac-den.active { background-color: #d6eaf8; border-radius: 4px; }

        /* Columns */
        #left-col { flex: 3; position: relative; display: flex; flex-direction: column; background: #ffffff; border-right: 2px solid #bdc3c7; }
        #right-col { flex: 1; min-width: 330px; max-width: 400px; background: #ecf0f1; display: flex; flex-direction: column; padding: 10px; z-index: 100; gap: 10px; }

        /* Content Area */
        #content-area { padding: 30px; overflow-y: auto; flex-grow: 1; z-index: 10; padding-bottom: 80px;}
        .question-text { font-size: 1.5em; margin-bottom: 30px; color: #2c3e50; line-height: 1.5;}

        /* Input Fields */
        .input-box {
            display: inline-flex; align-items: center; justify-content: center;
            background: #f8f9fa; border: 2px solid #bdc3c7; border-radius: 8px;
            min-width: 44px; min-height: 44px; padding: 5px 10px; cursor: pointer;
            color: #2c3e50; vertical-align: middle; font-family: Cambria, 'Times New Roman', serif; z-index: 20;
        }
        .input-box.active { border-color: #3498db; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.3); background: #fff; }
        .input-box.correct { border-color: #27ae60; background: #e8f8f5; color: #27ae60; pointer-events: none;}
        .input-box.incorrect { border-color: #e74c3c; background: #fdedec; }
        .input-box.locked { background: #e0e0e0; border-color: #bdc3c7; opacity: 0.5; pointer-events: none; }

        .scaffold-step {
            background: #fdfefe; border: 1px solid #d0d3d4; padding: 20px;
            border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
            transition: opacity 0.3s;
        }
        .locked-step { opacity: 0.4; pointer-events: none; background: #f2f4f4; border-color: #e5e8e8; }

        /* MCQ Options for Skill 4 */
        .mcq-btn {
            background: white; border: 2px solid #bdc3c7; border-radius: 8px; padding: 15px; 
            text-align: left; font-size: 1.1em; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; min-height: 60px; color: #2c3e50;
        }
        .mcq-btn:hover { border-color: #3498db; background: #f4f6f8; }
        .mcq-btn.selected { border-color: #3498db; background: #e8f8f5; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.3); }
        .mcq-btn.correct { border-color: #27ae60; background: #e8f8f5; color: #27ae60; pointer-events: none;}
        .mcq-btn.incorrect { border-color: #e74c3c; background: #fdedec; pointer-events: none;}

        /* Feedback & Solutions */
        .feedback { font-weight: bold; margin-top: 15px; font-size: 1.2em; min-height: 28px;}
        .feedback.correct { color: #27ae60; }
        .feedback.incorrect { color: #e74c3c; }
        #solution-box {
            background: #fff3cd; border-left: 5px solid #ffc107; padding: 15px;
            margin-top: 20px; border-radius: 0 8px 8px 0; font-size: 1.1em; line-height: 1.6;
        }

        /* Controls */
        .control-panel { display: flex; flex-direction: column; align-items: stretch; gap: 10px; background: white; padding: 10px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; }
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px;}
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%;}
        input:checked + .slider { background-color: #27ae60; }
        input:checked + .slider:before { transform: translateX(26px); }
        .toggle-label { font-weight: bold; color: #2c3e50; font-size: 1.1em;}

        /* Virtual Keypad */
        .keyboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: auto; padding-bottom: 5px;}
        .keyboard.mcq-mode .key:not(.submit):not(.next) { opacity: 0.3; pointer-events: none; }
        .key {
            background: white; border: none; border-radius: 8px; font-size: 1.2em; font-weight: bold;
            color: #333; min-height: 42px; box-shadow: 0 3px 0 #bdc3c7; cursor: pointer;
            display: flex; align-items: center; justify-content: center; padding: 0;
        }
        .key:active { background: #e5e7eb; box-shadow: 0 0 0 #bdc3c7; transform: translateY(3px); }
        .key.action { background: #95a5a6; color: white; box-shadow: 0 3px 0 #7f8c8d; font-size: 1rem; }
        .key.submit { background: #3498db; color: white; box-shadow: 0 3px 0 #2980b9;}
        .key.next { background: #27ae60; color: white; box-shadow: 0 3px 0 #2ecc71; display: none;}
        .key.frac-btn { background: #e67e22; color: white; box-shadow: 0 3px 0 #d35400; font-size: 1rem; }
        .key.undef-btn { background: #e74c3c; color: white; box-shadow: 0 3px 0 #c0392b; font-size: 0.9em;}
        
        /* Highlight math variables in Keypad with different background */
        .key.math-var { background: #9b59b6; color: white; box-shadow: 0 3px 0 #8e44ad; }
        .key.math-var:active { background: #8e44ad; box-shadow: 0 0 0 #8e44ad; }

        /* Stylus Annotation Canvas */
        #draw-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; }
        #draw-layer.active { pointer-events: auto; touch-action: none;}
        
        #draw-toolbar {
            display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; z-index: 101;
        }
        .tool-btn { 
            height: 38px; padding: 0 12px; border: 2px solid transparent; 
            border-radius: 8px; background: rgba(255,255,255,0.15); 
            color: white; font-size: 0.95em; font-weight: 600; 
            cursor: pointer; display: flex; align-items: center; gap: 6px; 
            transition: background 0.2s;
        }
        .tool-btn:hover { background: rgba(255,255,255,0.25); }
        .tool-btn.active { background: white; color: #2c3e50; border-color: white; }
        .tool-btn.action { background: #e74c3c; color: white; }
        .tool-btn.action:hover { background: #c0392b; }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 300; display: flex; justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        #viz-canvas { background: #fafafa; border: 2px solid #bdc3c7; border-radius: 8px; margin: 15px 0; width: 100%; max-width: 400px; }

    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; min-width: 200px;">
            <button id="btn-menu" class="header-btn secondary hidden">Menu</button>
            <span id="header-title" style="margin-left: 15px;">Coordinate Geometry</span>
        </div>
        
        <div id="draw-toolbar" class="hidden">
            <button class="tool-btn" id="tool-cursor" title="Cursor (Type)">👆 Cursor</button>
            <button class="tool-btn" id="tool-pen" title="Pen">🖊️ Pen</button>
            <button class="tool-btn" id="tool-erase" title="Eraser">🧼 Erase</button>
            <button class="tool-btn action" id="tool-clear" title="Clear All">🗑️ Clear</button>
        </div>

        <div id="score-board" class="score-board hidden">
            <span class="score-correct">Correct: <span id="score-c">0</span></span>
            <span class="score-wrong">Wrong: <span id="score-w">0</span></span>
        </div>
    </header>

    <div id="menu-screen">
        <h2 style="color:#2c3e50; font-size: 2em; margin-bottom: 40px;">Select a Skill Practice</h2>
        <button class="menu-btn" data-skill="1">Skill 1: Gradient of a Line</button>
        <button class="menu-btn" data-skill="2">Skill 2: Equation of a Line</button>
        <button class="menu-btn" data-skill="3">Skill 3: Length of a Line</button>
        <button class="menu-btn" data-skill="4">Skill 4: Mathematical Interpretation</button>
    </div>

    <div id="app-screen" class="hidden">
        
        <div id="left-col">
            <div id="content-area">
                <div id="question-text" class="question-text math-expr"></div>

                <div id="scaffold-container" class="hidden"></div>

                <div class="scaffold-step math-expr" id="final-answer-container">
                    <span id="final-prefix">Final Answer: <span class="math-var" id="final-var">m</span> = </span>
                    <div class="input-box active" id="input-final" data-id="final" style="margin-left: 10px; min-width: 150px;"></div>
                </div>

                <div id="mcq-container" class="hidden" style="display:flex; flex-direction:column; gap:12px; margin-top:20px;"></div>

                <div id="feedback" class="feedback"></div>
                <div id="solution-box" class="math-expr hidden"></div>
            </div>

            <canvas id="draw-layer"></canvas>
        </div>

        <div id="right-col">
            <div class="control-panel">
                <div class="toggle-row" id="scaffold-toggle-row">
                    <span class="toggle-label">Scaffold Mode</span>
                    <label class="switch">
                        <input type="checkbox" id="scaffold-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <button id="btn-visualise" class="header-btn" style="width: 100%;">Visualise Problem</button>
            </div>

            <div class="keyboard">
                <button class="key math-expr">7</button>
                <button class="key math-expr">8</button>
                <button class="key math-expr">9</button>
                <button class="key action">DEL</button>

                <button class="key math-expr">4</button>
                <button class="key math-expr">5</button>
                <button class="key math-expr">6</button>
                <button class="key math-expr">+</button>

                <button class="key math-expr">1</button>
                <button class="key math-expr">2</button>
                <button class="key math-expr">3</button>
                <button class="key math-expr">-</button>

                <button class="key math-expr">0</button>
                <button class="key math-expr">.</button>
                <button class="key math-expr">,</button>
                <button class="key math-expr">=</button>

                <button class="key math-var">x</button>
                <button class="key math-var">y</button>
                <button class="key math-expr">(</button>
                <button class="key math-expr">)</button>

                <button class="key math-var">k</button>
                <button class="key math-var">m</button>
                <button class="key math-var">c</button>
                <button class="key math-var">a</button>

                <button class="key math-expr frac-btn" id="btn-frac" style="grid-column: span 2;">a/b</button>
                <button class="key math-expr undef-btn" style="grid-column: span 2;">undef</button>
                
                <button class="key submit" id="btn-submit" style="grid-column: span 4;">SUBMIT</button>
                <button class="key next" id="btn-next" style="grid-column: span 4;">NEXT QUESTION</button>
            </div>
        </div>
    </div>

    <div id="viz-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#2c3e50;">Problem Visualization</h3>
            <canvas id="viz-canvas" width="400" height="400"></canvas>
            <br>
            <button class="header-btn" id="btn-close-viz" style="width: 100%;">Close</button>
        </div>
    </div>

    <script>
        // --- State Management ---
        const state = {
            currentSkill: 1,
            scaffold: false,
            scaffoldSteps: [],
            currentStepIndex: 0,
            wrongAttempts: 0,
            scoreCorrect: 0,
            scoreWrong: 0,
            currentQType: 'A',
            qData: {}, 
            answers: {},
            inputs: {},
            activeInputId: 'final',
            activeSubFrac: 'num'
        };

        const ALL_INPUTS = ['m', 'y2', 'y1', 'x2', 'x1', 'c', 'm1', 'm2', 'sub_y', 'sub_m', 'sub_x', 'final', 'm1_eq', 'c1_eq'];
        
        function resetInputs() {
            ALL_INPUTS.forEach(id => {
                state.inputs[id] = { type: 'text', val: '', num: '', den: '' };
            });
            state.activeInputId = 'final'; 
            
            document.querySelectorAll('.input-box').forEach(el => {
                el.innerHTML = '';
                el.classList.remove('correct', 'incorrect');
            });
            document.querySelectorAll('.mcq-btn').forEach(el => {
                el.classList.remove('selected', 'correct', 'incorrect');
            });
        }

        // --- Math & Formatting Helpers ---
        const wrapVar = (v) => `<span class="math-var">${v}</span>`;
        const wrapSub = (v, sub) => `<span class="math-var">${v}</span><sub>${sub}</sub>`;
        const makeFrac = (n, d) => `<span class="frac"><span class="frac-num">${n}</span><span class="frac-den">${d}</span></span>`;
        
        function getSurdHTML(content) {
            return `
            <span class="surd-wrapper" style="display: inline-flex; align-items: stretch; vertical-align: middle; margin: 0 2px;">
                <span style="display: flex; flex-direction: column; justify-content: flex-end;">
                    <svg width="15" height="100%" viewBox="0 0 15 50" preserveAspectRatio="none" style="stroke: #2c3e50; stroke-width: 2px; fill: none; margin-bottom: -1px; min-height: 20px;">
                        <path d="M 1,30 L 5,30 L 9,48 L 15,0" vector-effect="non-scaling-stroke" />
                    </svg>
                </span>
                <span style="border-top: 2px solid #2c3e50; padding: 4px 5px 0 5px; margin-top: 1px; display: inline-flex; align-items: center; gap: 5px;">
                    ${content}
                </span>
            </span>`;
        }

        function formatMath(str) {
            let res = str.replace(/(\()?(\s*-\s*)?(\d*[a-zA-Z]*)\s*\/\s*(\s*-\s*)?(\d*)(\))?/g, (match, leftBrack, sign1, n, sign2, d, rightBrack) => {
                let isNeg = (sign1 && sign1.includes('-')) !== (sign2 && sign2.includes('-'));
                let frac = makeFrac(n || '&nbsp;', d || '&nbsp;');
                let html = isNeg ? `<span class="fraction-wrapper"><span class="negative-sign">-</span>${frac}</span>` : frac;
                if (leftBrack) html = `<span class="tall-bracket">(</span>` + html;
                if (rightBrack) html = html + `<span class="tall-bracket">)</span>`;
                return html;
            });
            
            let tokens = res.split(/(<[^>]+>)/g);
            for (let i = 0; i < tokens.length; i++) {
                if (!tokens[i].startsWith('<')) {
                    tokens[i] = tokens[i].replace(/[kxyac]/g, match => wrapVar(match));
                }
            }
            return tokens.join('');
        }

        const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        function gcd(a, b) { return !b ? a : gcd(b, a % b); }
        function cleanString(str) { return str.replace(/\s+/g, '').toLowerCase(); }
        
        function evalFracStr(str) { 
            if (str === undefined || str === null) return NaN;
            str = String(str).replace(/[()]/g, '');
            if (str.toLowerCase() === 'undefined' || str.toLowerCase() === 'undef') return Infinity;
            if (!str.includes('/')) return parseFloat(str);
            let [n, d] = str.split('/'); return parseFloat(n) / parseFloat(d);
        }

        function evaluate(data) {
            if (!data) return NaN;
            if (data.type === 'text') {
                let strippedVal = data.val.replace(/[()]/g, '');
                if (strippedVal === '' || strippedVal === '-') return NaN;
                if (strippedVal === 'undefined' || strippedVal === 'undef') return Infinity;
                return parseFloat(strippedVal);
            } else if (data.type === 'frac') {
                let nStr = (data.num || '').replace(/[()]/g, '');
                let dStr = (data.den || '').replace(/[()]/g, '');
                let n = parseFloat(nStr) || 0;
                let d = parseFloat(dStr);
                if (d === 0 || isNaN(d)) return Infinity;
                return (data.isNegative ? -1 : 1) * (n / d); 
            }
            return NaN;
        }

        function formatEq(m, c) {
            let res = "";
            if (m === "0") return c;
            if (m === "1") res = "x"; else if (m === "-1") res = "-x"; else res = m + "x";
            if (c !== "0") {
                res += (c.startsWith("-") ? " - " + c.substring(1) : " + " + c);
            }
            return res;
        }

        function formatEqRev(m, c) {
            if (m === "0") return c;
            if (c === "0") return formatEq(m, c);
            let mTerm = "";
            if (m === "1") mTerm = "x";
            else if (m === "-1") mTerm = "-x";
            else mTerm = m + "x";
            
            if (mTerm.startsWith("-")) {
                return c + " - " + mTerm.substring(1);
            } else {
                return c + " + " + mTerm;
            }
        }

        function getAcceptedAnswers(m_str, c_str) {
            let ans = [formatEq(m_str, c_str), formatEqRev(m_str, c_str)];
            if (m_str.includes('/')) {
                let [num, den] = m_str.split('/');
                let altM = num === "1" ? `x/${den}` : (num === "-1" ? `-x/${den}` : `${num}x/${den}`);
                
                let altEq = altM;
                if (c_str !== "0") altEq += (c_str.startsWith("-") ? " - " + c_str.substring(1) : " + " + c_str);
                
                let altEqRev = altM;
                if (c_str !== "0") {
                    if (altM.startsWith("-")) {
                        altEqRev = c_str + " - " + altM.substring(1);
                    } else {
                        altEqRev = c_str + " + " + altM;
                    }
                }
                ans.push(altEq, altEqRev);
            }
            return ans.map(a => 'y = ' + a); 
        }

        function generatePoints() {
            let x1, y1, x2, y2;
            do {
                x1 = Math.floor(Math.random() * 11) - 5;
                y1 = Math.floor(Math.random() * 11) - 5;
                x2 = Math.floor(Math.random() * 11) - 5;
                y2 = Math.floor(Math.random() * 11) - 5;
            } while (x1 === x2 && y1 === y2); 
            return {A: {x: x1, y: y1}, B: {x: x2, y: y2}};
        }

        // --- Question Routing ---
        function generateQuestion() {
            state.wrongAttempts = 0;
            state.currentStepIndex = 0;
            resetInputs();
            
            document.getElementById('feedback').innerHTML = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('solution-box').classList.add('hidden');
            document.getElementById('btn-submit').style.display = 'block';
            document.getElementById('btn-next').style.display = 'none';
            document.querySelector('.keyboard').classList.remove('mcq-mode');

            if(window.drawCtx) window.drawCtx.clearRect(0, 0, document.getElementById('draw-layer').width, document.getElementById('draw-layer').height);

            if (state.currentSkill === 1) generateQuestionSkill1();
            else if (state.currentSkill === 2) generateQuestionSkill2();
            else if (state.currentSkill === 3) generateQuestionSkill3();
            else generateQuestionSkill4();

            updateLayout();
        }

        // --- Skill 1 Generator ---
        function generateQuestionSkill1() {
            document.querySelectorAll('.input-box').forEach(el => {
                if (document.body.contains(el)) el.classList.remove('correct', 'incorrect');
            });

            state.currentQType = Math.random() < 0.3 ? 'B' : 'A';
            if (state.currentQType === 'B') {
                state.scaffoldSteps = [['m', 'y2', 'y1', 'x2', 'x1']];

                let k_val = randInt(-4, 4); let m_val = randInt(-3, 3); if (m_val === 0) m_val = 1;
                let a = randInt(-9, 3); let b = randInt(-4, 2); let c = k_val * (m_val * b + 1) - m_val * a;

                if (!valStr) return '';
                let clean = valStr.toString().replace(/[()]/g, '');
                if (!clean.includes('/')) return wrapBrackets ? `(${clean})` : clean;
                
                let [n, d] = clean.split('/');
                let sign = n.startsWith('-') ? '-' : '';
                if (sign) n = n.substring(1);
                
                let fracHtml = sign 
                    ? `<span class="fraction-wrapper"><span class="negative-sign">-</span><span class="frac" style="margin: 0 4px;"><span class="frac-num">${n}</span><span class="frac-den">${d}</span></span></span>`
                    : `<span class="frac" style="margin: 0 4px;"><span class="frac-num">${n}</span><span class="frac-den">${d}</span></span>`;
                
                if (wrapBrackets) return `<span class="tall-bracket">(</span>${fracHtml}<span class="tall-bracket">)</span>`;
                return fracHtml;

            const formatEqHTML = (m, c) => {

        function generateQuestionSkill3() {

            state.points = pts;
            state.currentQType = 'S3';
            
            let scafHTML = '';
            document.getElementById('input-final').classList.remove('correct', 'incorrect');
            
            let actualLength = Math.sqrt(Math.pow(pts.B.x - pts.A.x, 2) + Math.pow(pts.B.y - pts.A.y, 2));
            document.getElementById('question-text').innerHTML = `Calculate the length of the line segment AB where <span class="math-var">A</span>(${pts.A.x}, ${pts.A.y}) and <span class="math-var">B</span>(${pts.B.x}, ${pts.B.y}).`;

                        ans10 = [`${m}`]; ans11 = [`${c}`];
                        vizM = m; vizC = c; vizLabel = `y = ${eqStr}`;
                    } else {
                        let A = randInt(1, 5); let B = randInt(-5, 5); if(B===0) B=1; let C = randInt(-10, 10);

                        let m_num = -A, m_den = B; let gm = gcd(Math.abs(m_num), Math.abs(m_den));

                        let c_num = C, c_den = B; let gc = gcd(Math.abs(c_num), Math.abs(c_den));

        }

        // --- Input Display & Layout Updates ---
        function setActiveInput(id, subId = null) {
            const targetEl = document.getElementById(`input-${id}`);
            if (!targetEl || targetEl.classList.contains('correct') || targetEl.classList.contains('locked')) return; 

            document.querySelectorAll('.input-box').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.frac-num, .frac-den').forEach(el => el.classList.remove('active'));

            state.activeInputId = id;
            targetEl.classList.add('active');

            if (state.inputs[id].type === 'frac') {
                if (subId) state.activeSubFrac = subId;
                const subEl = targetEl.querySelector(`.frac-${state.activeSubFrac}`);
                if(subEl) subEl.classList.add('active');
            }
        }

        function renderInputDisplay(id) {
            const container = document.getElementById(`input-${id}`);
            if(!container) return;
            const data = state.inputs[id];
            
            if (data.type === 'text') {
                let formatted = data.val;
                
                formatted = formatted.replace(/(\()?(\s*-\s*)?(\d*[a-zA-Z]*)\s*\/\s*(\s*-\s*)?(\d*)(\))?/g, (match, leftBrack, sign1, n, sign2, d, rightBrack) => {
                    let isNeg = (sign1 && sign1.includes('-')) !== (sign2 && sign2.includes('-'));
                    let frac = `<span class="frac"><span class="frac-num">${n || '&nbsp;'}</span><span class="frac-den">${d || '&nbsp;'}</span></span>`;
                    let fracHtml = isNeg ? `<span class="fraction-wrapper"><span class="negative-sign">-</span>${frac}</span>` : frac;
                    
                    if (leftBrack) fracHtml = `<span class="tall-bracket">(</span>` + fracHtml;
                    if (rightBrack) fracHtml = fracHtml + `<span class="tall-bracket">)</span>`;
                    return fracHtml;
                });
                
                formatted = formatted.replace(/(<[^>]+>)|([kxyac])/g, (match, htmlTag, variable) => {
                    if (htmlTag) return htmlTag;
                    return wrapVar(variable);
                });
                
                container.innerHTML = formatted === '' ? '&nbsp;&nbsp;' : formatted;
            } else if (data.type === 'frac') {
                let numStr = data.num || '';
                let denStr = data.den || '';
                
                let hasLeftBrack = false;
                let hasRightBrack = false;
                
                if (numStr.startsWith('(')) {
                    hasLeftBrack = true;
                    numStr = numStr.substring(1);
                }
                if (denStr.endsWith(')')) {
                    hasRightBrack = true;
                    denStr = denStr.slice(0, -1);
                }

                let negCount = 0;
                if (numStr.startsWith('-')) { negCount++; numStr = numStr.substring(1); }
                if (denStr.startsWith('-')) { negCount++; denStr = denStr.substring(1); }
                if (data.isNegative) negCount++;

                let isNetNegative = (negCount % 2 !== 0);
                let signHtml = isNetNegative ? `<span class="negative-sign">-</span>` : '';

                let nHtml = numStr.replace(/[kxyac]/g, match => wrapVar(match));
                let dHtml = denStr.replace(/[kxyac]/g, match => wrapVar(match));
                
                let fracCore = `
                    <div class="fraction-wrapper">
                        ${signHtml}
                        <div class="fraction">
                            <div class="frac-num ${state.activeSubFrac === 'num' ? 'active' : ''}" data-sub="num">${nHtml === '' ? '&nbsp;' : nHtml}</div>
                            <div class="frac-den ${state.activeSubFrac === 'den' ? 'active' : ''}" data-sub="den">${dHtml === '' ? '&nbsp;' : dHtml}</div>
                        </div>
                    </div>
                `;

                container.innerHTML = (hasLeftBrack ? `<span class="tall-bracket">(</span>` : '') + fracCore + (hasRightBrack ? `<span class="tall-bracket">)</span>` : '');
            }
            if (id === state.activeInputId) setActiveInput(id, state.activeSubFrac);
        }

        function toggleFraction() {
            const id = state.activeInputId;
            if (state.currentSkill === 2 && id === 'final') {
                state.inputs[id].val += '/'; renderInputDisplay(id); return;
            }
            
            if (state.inputs[id].type === 'text') {
                let currentVal = state.inputs[id].val;
                let isNeg = currentVal.includes('-');
                
                state.inputs[id].type = 'frac';
                state.inputs[id].num = currentVal.replace('-', '');
                state.inputs[id].den = '';
                state.inputs[id].isNegative = isNeg;
                state.activeSubFrac = 'den';
            } else {
                state.inputs[id].type = 'text';
                state.inputs[id].val = state.inputs[id].num;
            }
            renderInputDisplay(id);
            setActiveInput(id, state.activeSubFrac);
        }

        function handleKeyPress(key) {
            const id = state.activeInputId;
            const data = state.inputs[id];
            
            if (key === 'DEL') {
                if (data.type === 'text') data.val = data.val.slice(0, -1);
                else {
                    data[state.activeSubFrac] = data[state.activeSubFrac].slice(0, -1);
                    if (data[state.activeSubFrac] === '' && data.isNegative) data.isNegative = false;
                }
            } else if (key === '-') {
                if (data.type === 'text') {
                    data.val += '-'; 
                } else if (data.type === 'frac') {
                     data.isNegative = !data.isNegative;
                }
            } else {
                if (data.type === 'text') data.val += key;
                else data[state.activeSubFrac] += key;
            }
            renderInputDisplay(id);
        }

            const scafContainer = document.getElementById('scaffold-container');
            const finContainer = document.getElementById('final-answer-container');
            const finInput = document.getElementById('input-final');
            const scafToggle = document.getElementById('scaffold-toggle-row');
            const mcqContainer = document.getElementById('mcq-container');
            const keyboard = document.querySelector('.keyboard');

            scafToggle.style.display = (state.currentSkill === 4) ? 'none' : 'flex';

            if (state.currentSkill === 4 && state.qData.isMCQ) {
                finContainer.classList.add('hidden');
                scafContainer.classList.add('hidden');
                mcqContainer.classList.remove('hidden');
                keyboard.classList.add('mcq-mode');
                
                mcqContainer.innerHTML = '';
                state.qData.mcqOptions.forEach((opt, idx) => {
                    let btn = document.createElement('button');
                    btn.className = 'mcq-btn math-expr';
                    btn.innerHTML = opt;
                    btn.dataset.index = idx;
                    btn.onclick = () => {
                        document.querySelectorAll('.mcq-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        state.inputs.final.val = idx.toString();
                    };
                    mcqContainer.appendChild(btn);
                });
            } else {
                mcqContainer.classList.add('hidden');
                finContainer.classList.remove('hidden');
                keyboard.classList.remove('mcq-mode');

                if (state.scaffold && state.currentSkill !== 4) {
                    scafContainer.classList.remove('hidden');
                    let firstUnlockedId = null;
                    for (let i = 0; i < state.scaffoldSteps.length; i++) {
                        if (i <= state.currentStepIndex) {
                            document.querySelector(`.step-${i}`).classList.remove('locked-step');
                            state.scaffoldSteps[i].forEach(id => {
                                let el = document.getElementById(`input-${id}`);
                                if (el && i === state.currentStepIndex) {
                                    el.classList.remove('locked');
                                    if (!firstUnlockedId) firstUnlockedId = id;
                                }
                            });
                        } else {
                            document.querySelector(`.step-${i}`).classList.add('locked-step');
                            state.scaffoldSteps[i].forEach(id => {
                                let el = document.getElementById(`input-${id}`);
                                if (el) el.classList.add('locked');
                            });
                        }
                    }
                    if (state.currentStepIndex >= state.scaffoldSteps.length) {
                        finContainer.classList.remove('locked-step');
                        finInput.classList.remove('locked');
                        setActiveInput('final');
                    } else {
                        finContainer.classList.add('locked-step');
                        finInput.classList.add('locked');
                        if (firstUnlockedId) setActiveInput(firstUnlockedId);
                    }
                } else {
                    scafContainer.classList.add('hidden');
                    finContainer.classList.remove('locked-step');
                    finInput.classList.remove('locked');
                    setActiveInput('final');
                }
            }
        }

        // --- Checking Logic ---
        function checkAnswers() {
            let fb = document.getElementById('feedback');
            
            let getVal = (obj) => {
                if (!obj || obj.val === undefined) return '';
                return obj.type === 'frac' 
                    ? ((obj.isNegative ? '-' : '') + obj.num + (obj.den && obj.den !== '1' ? '/' + obj.den : '')) 
                    : obj.val;
            };

            let match = (inputObj, expectedStr) => {
                let uStr = cleanString(getVal(inputObj));
                let eStr = cleanString(expectedStr);
                
                if (uStr === eStr) return { matched: true, exact: true };
                
                let eNoBrackets = eStr.replace(/[()]/g, '');
                if (uStr === eNoBrackets) return { matched: true, exact: false };

                let tempObj = { ...inputObj, val: inputObj.type === 'text' ? inputObj.val.replace(/[()]/g, '') : inputObj.val };
                let uVal = evaluate(tempObj);
                let eVal = evalFracStr(eNoBrackets);
                
                let isNumericMatch = false;
                if (eVal === Infinity && uVal === Infinity) isNumericMatch = true;
                else if (!isNaN(uVal) && !isNaN(eVal) && Math.abs(uVal - eVal) < 0.001) isNumericMatch = true;

                if (isNumericMatch) {
                    let hasBrackets = uStr.includes('(') && uStr.includes(')');
                    let expHasBrackets = eStr.includes('(') && eStr.includes(')');
                    if (expHasBrackets) return { matched: true, exact: hasBrackets };
                    return { matched: true, exact: true }; 
                }
                return { matched: false, exact: false };
            };

            let missingBrackets = false;
            let customMsg = null;

            if (state.scaffold && state.currentStepIndex < state.scaffoldSteps.length) {
                let currentIds = state.scaffoldSteps[state.currentStepIndex];
                let isCorrect = true;

                if (currentIds.includes('sub_y') && currentIds.includes('sub_m') && currentIds.includes('sub_x')) {
                    let validPairs = [];
                    for (let p of state.answers.sub_pairs) {
                        let my = match(state.inputs.sub_y, p.y);
                        let mm = match(state.inputs.sub_m, p.m);
                        let mx = match(state.inputs.sub_x, p.x);
                        if (my.matched && mm.matched && mx.matched) {
                            validPairs.push({y: my, m: mm, x: mx});
                        }
                    }

                    if (validPairs.length > 0) {
                        let exactMatch = validPairs.some(vp => vp.y.exact && vp.m.exact && vp.x.exact);
                        if (exactMatch) {
                            ['sub_y', 'sub_m', 'sub_x'].forEach(id => {
                                let el = document.getElementById(`input-${id}`);
                                el.classList.add('correct'); el.classList.remove('incorrect');
                            });
                        } else {
                            missingBrackets = true;
                            isCorrect = false;
                            ['sub_y', 'sub_m', 'sub_x'].forEach(id => {
                                let el = document.getElementById(`input-${id}`);
                                el.classList.add('incorrect'); el.classList.remove('correct');
                            });
                        }
                    } else {
                        isCorrect = false;
                        ['sub_y', 'sub_m', 'sub_x'].forEach(id => {
                            let el = document.getElementById(`input-${id}`);
                            el.classList.add('incorrect'); el.classList.remove('correct');
                        });

                        // Visual cue generator for Skill 2 substitutions
                        let p = state.answers.sub_pairs[0];
                        let cx = `<span style="color:#e74c3c">${p.x}</span>`;
                        let cy = `<span style="color:#27ae60">${p.y}</span>`;
                        let cm = `<span style="color:#3498db">${p.m}</span>`;
                        
                        customMsg = `<div style="font-weight:normal; font-size:1rem; line-height:1.6; margin-top:10px; padding:15px; background:#fdedec; border-radius:8px; border-left: 5px solid #e74c3c;">
                            <b>Incorrect substitution. Map the variables carefully:</b><br><br>
                            Point (x, y) &rarr; (<span style="color:#e74c3c; font-weight:bold;">x</span>, <span style="color:#27ae60; font-weight:bold;">y</span>) = (${cx}, ${cy})<br>
                            Gradient <span style="color:#3498db; font-weight:bold;">m</span> = ${cm}<br><br>
                            <span class="math-var">y = mx + c</span> &rarr; <b>${cy} = ${cm}${cx} + c</b>
                        </div>`;
                    }
                } 
                else if (currentIds.includes('y2') && currentIds.includes('x1')) {
                    
                    let ex1 = state.answers.x1; let ey1 = state.answers.y1;
                    let ex2 = state.answers.x2; let ey2 = state.answers.y2;

                    // Standard (Point 2 - Point 1)
                    let t1 = [
                        match(state.inputs.x2, ex2), match(state.inputs.x1, ex1),
                        match(state.inputs.y2, ey2), match(state.inputs.y1, ey1)
                    ]; 
                    
                    // Reversed (Point 1 - Point 2)
                    let t2 = [
                        match(state.inputs.x2, ex1), match(state.inputs.x1, ex2),
                        match(state.inputs.y2, ey1), match(state.inputs.y1, ey2)
                    ]; 

                    let isStandardValid = t1.every(m => m.matched);
                    let isReversedValid = t2.every(m => m.matched);

                    let validTuples = [];
                    // This strictly forces y and x orders across ALL skills including Length.
                    if (isStandardValid) validTuples.push(t1);
                    if (isReversedValid) validTuples.push(t2);

                    if (validTuples.length > 0) {
                        let exactMatch = validTuples.some(t => t.every(m => m.exact));
                        
                        if (exactMatch) {
                            ['x2', 'x1', 'y2', 'y1'].forEach(id => {
                                let el = document.getElementById(`input-${id}`);
                                el.classList.add('correct'); el.classList.remove('incorrect');
                            });
                        } else {
                            missingBrackets = true;
                            isCorrect = false;
                            ['x2', 'x1', 'y2', 'y1'].forEach(id => {
                                let el = document.getElementById(`input-${id}`);
                                el.classList.add('incorrect'); el.classList.remove('correct');
                            });
                        }
                    } else {
                        isCorrect = false;
                        ['x2', 'x1', 'y2', 'y1'].forEach(id => {
                            let el = document.getElementById(`input-${id}`);
                            el.classList.add('incorrect'); el.classList.remove('correct');
                        });

                        // Visual cue generator for Skill 1 & 3 substitutions
                        let cx1 = `<span style="color:#e74c3c">${ex1}</span>`;
                        let cy1 = `<span style="color:#27ae60">${ey1}</span>`;
                        let cx2 = `<span style="color:#3498db">${ex2}</span>`;
                        let cy2 = `<span style="color:#8e44ad">${ey2}</span>`;
                        
                        let formulaHtml = "";
                        if (state.currentSkill === 1 || state.currentSkill === 2) {
                            formulaHtml = `<span class="math-var">m</span> = <span class="frac" style="vertical-align:middle; margin:0 5px;"><span class="frac-num" style="padding-bottom:5px;">${cy2} - ${cy1}</span><span class="frac-den" style="padding-top:5px;">${cx2} - ${cx1}</span></span>`;
                        } else if (state.currentSkill === 3) {
                            formulaHtml = `Length = ${getSurdHTML(`(${cx2} - ${cx1})&sup2; + (${cy2} - ${cy1})&sup2;`)}`;
                        }

                        customMsg = `<div style="font-weight:normal; font-size:1rem; line-height:1.6; margin-top:10px; padding:15px; background:#fdedec; border-radius:8px; border-left: 5px solid #e74c3c;">
                            <b>Incorrect substitution. Ensure points are aligned:</b><br><br>
                            Point 1 (x\u2081, y\u2081) &rarr; (<span style="color:#e74c3c; font-weight:bold;">x\u2081</span>, <span style="color:#27ae60; font-weight:bold;">y\u2081</span>) = (${cx1}, ${cy1})<br>
                            Point 2 (x\u2082, y\u2082) &rarr; (<span style="color:#3498db; font-weight:bold;">x\u2082</span>, <span style="color:#8e44ad; font-weight:bold;">y\u2082</span>) = (${cx2}, ${cy2})<br><br>
                            ${formulaHtml}
                        </div>`;
                    }
                    
                    if (currentIds.includes('m')) {
                        let el_m = document.getElementById('input-m');
                        let mMatch = match(state.inputs.m, state.answers.m);
                        if (mMatch.matched && mMatch.exact) {
                            el_m.classList.add('correct'); el_m.classList.remove('incorrect');
                        } else {
                            el_m.classList.add('incorrect'); el_m.classList.remove('correct');
                            isCorrect = false;
                            if (mMatch.matched && !mMatch.exact) missingBrackets = true;
                        }
                    }
                }
                else {
                    currentIds.forEach(id => {
                        let el = document.getElementById(`input-${id}`);
                        let mMatch = match(state.inputs[id], state.answers[id]);
                        if (mMatch.matched && mMatch.exact) {
                            el.classList.add('correct'); el.classList.remove('incorrect');
                        } else {
                            el.classList.add('incorrect'); el.classList.remove('correct');
                            isCorrect = false;
                            if (mMatch.matched && !mMatch.exact) missingBrackets = true;
                        }
                    });
                }

                if (isCorrect) {
                    state.wrongAttempts = 0; 
                    state.currentStepIndex++;
                    if (state.currentStepIndex < state.scaffoldSteps.length) {
                        fb.innerHTML = "Step correct! Proceed to the next step."; fb.className = "feedback correct";
                    } else {
                        fb.innerHTML = "Scaffold complete! Enter the final answer."; fb.className = "feedback correct";
                    }
                    updateLayout();
                    return; 
                } else {
                    if (missingBrackets) {
                        handleWrongAttempt(fb, "You have missed out the brackets.");
                    } else {
                        handleWrongAttempt(fb, customMsg || "Step is incorrect. Try again.");
                    }
                    return; 
                }
            }

            // --- Check Final Answer ---
            const finEl = document.getElementById('input-final');
            let allCorrect = false;

            if (state.currentSkill === 1) {
                let userFin = evaluate(state.inputs.final);
                let expectedFin = evalFracStr(state.answers.final);
                if (expectedFin === Infinity) { allCorrect = (userFin === Infinity); }
                else { allCorrect = !isNaN(userFin) && Math.abs(userFin - expectedFin) < 0.001; }
            } 
            else if (state.currentSkill === 2) {
                let userFin = cleanString(state.inputs.final.type === 'frac' ? `${state.inputs.final.num}/${state.inputs.final.den}` : state.inputs.final.val);
                if (state.answers.acceptedFinals.some(ans => cleanString(ans) === userFin)) allCorrect = true;
            } 
            else if (state.currentSkill === 3) {
                let actualLength = Math.sqrt(Math.pow(state.qData.x2 - state.qData.x1, 2) + Math.pow(state.qData.y2 - state.qData.y1, 2));
                let userLength = evaluate(state.inputs.final);
                let expectedLength = (actualLength % 1 === 0) ? actualLength : Number(actualLength.toPrecision(3));
                allCorrect = !isNaN(userLength) && Math.abs(userLength - expectedLength) < 0.0001;
            }
            else if (state.currentSkill === 4) {
                if (state.qData.isMCQ) {
                    let userAns = parseInt(state.inputs.final.val);
                    if (isNaN(userAns)) {
                        handleWrongAttempt(fb, "Please select an option.");
                        return;
                    }
                    if (userAns === state.qData.correctAnswerIndex) {
                        allCorrect = true;
                        document.querySelector(`.mcq-btn[data-index="${userAns}"]`).classList.add('correct');
                    } else {
                        document.querySelector(`.mcq-btn[data-index="${userAns}"]`).classList.add('incorrect');
                    }
                } else {
                    let userFin = cleanString(state.inputs.final.type === 'frac' ? `${state.inputs.final.num}/${state.inputs.final.den}` : state.inputs.final.val);
                    let isNumericScenario = [1, 2, 10, 11].includes(parseInt(state.currentQType.split('_')[1]));
                    
                    if (isNumericScenario) {
                        let userVal = evaluate(state.inputs.final);
                        let expVal = evalFracStr(state.answers.acceptedFinals[0]);
                        if (expVal === Infinity) { allCorrect = (userVal === Infinity || userFin.includes('undef')); }
                        else { allCorrect = !isNaN(userVal) && Math.abs(userVal - expVal) < 0.001; }
                    } else {
                        if (state.answers.acceptedFinals.some(ans => cleanString(ans) === userFin)) allCorrect = true;
                    }
                }
            }

            if (allCorrect) {
                if(finEl) { finEl.classList.add('correct'); finEl.classList.remove('incorrect'); }
                handleCorrectAttempt(fb);
            } else { 
                if(finEl) { finEl.classList.add('incorrect'); }
                handleWrongAttempt(fb); 
            }
        }

        function handleCorrectAttempt(fb) {
            fb.innerHTML = "Correct!"; fb.className = "feedback correct";
            document.getElementById('btn-submit').style.display = 'none';
            document.getElementById('btn-next').style.display = 'block';
            if (state.wrongAttempts === 0) {
                state.scoreCorrect++; document.getElementById('score-c').textContent = state.scoreCorrect;
            }
            
            document.getElementById('solution-box').innerHTML = state.solutionHTML || "Solved perfectly.";
            document.getElementById('solution-box').classList.remove('hidden');

            document.querySelectorAll('.input-box').forEach(el => el.classList.remove('active'));
        }

        function handleWrongAttempt(fb, customMsg) {
            state.wrongAttempts++;
            if (state.wrongAttempts === 1) { 
                state.scoreWrong++; document.getElementById('score-w').textContent = state.scoreWrong; 
                fb.innerHTML = customMsg || "Incorrect. Try one more time."; fb.className = "feedback incorrect";
            } else {
                fb.innerHTML = "Incorrect. Review the solution below."; fb.className = "feedback incorrect";
                
                document.getElementById('btn-submit').style.display = 'none';
                document.getElementById('btn-next').style.display = 'block';
                
                document.getElementById('solution-box').innerHTML = state.solutionHTML;
                document.getElementById('solution-box').classList.remove('hidden');
            }
        }

        // --- App Navigation ---
        function showMenu() {
            document.getElementById('menu-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('btn-menu').classList.add('hidden');
            document.getElementById('draw-toolbar').classList.add('hidden');
            document.getElementById('score-board').classList.add('hidden');
            document.getElementById('header-title').textContent = "Coordinate Geometry";
        }

        function startSkill(e) {
            state.currentSkill = parseInt(e.target.dataset.skill);
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('btn-menu').classList.remove('hidden');
            document.getElementById('draw-toolbar').classList.remove('hidden');
            document.getElementById('score-board').classList.remove('hidden');
            let skillText = state.currentSkill === 1 ? "Skill 1: Gradient" : (state.currentSkill === 2 ? "Skill 2: Equation" : (state.currentSkill === 3 ? "Skill 3: Length of a Line" : "Skill 4: Interpretation"));
            document.getElementById('header-title').textContent = skillText;
            setTimeout(resizeCanvas, 50);
            generateQuestion();
        }

        // --- Visualisation Tool ---
        function openVisualise() {
            document.getElementById('viz-modal').classList.remove('hidden');
            const vCanvas = document.getElementById('viz-canvas'); const vCtx = vCanvas.getContext('2d');
            const width = vCanvas.width; const height = vCanvas.height;
            vCtx.clearRect(0, 0, width, height);

            let maxCoord = 10;
            if (state.currentSkill === 1 || state.currentSkill === 3) {
                let {x1, y1, x2, y2} = state.qData;
                maxCoord = Math.max(Math.abs(x1), Math.abs(x2), Math.abs(y1), Math.abs(y2));
            } else if (state.currentSkill === 2) {
                let q = state.qData;
                if (q.type === 1) maxCoord = Math.max(Math.abs(evalFracStr(q.c_str)), 5);
                else if (q.type === 2) maxCoord = Math.max(Math.abs(q.x1), Math.abs(q.y1), Math.abs(evalFracStr(q.c_str)), 5);
                else if (q.type === 3) maxCoord = Math.max(Math.abs(q.x1), Math.abs(q.y1), Math.abs(q.x2), Math.abs(q.y2), 5);
                else if (q.type === 4) maxCoord = Math.max(Math.abs(q.x1), Math.abs(q.y1), Math.abs(evalFracStr(q.c_str)), 5);
            }
            if (maxCoord === 0) maxCoord = 1;
            let padding = Math.max(2, maxCoord * 0.2); let limit = maxCoord + padding; 
            let scale = (width / 2) / limit;

            // Grid and Axes
            vCtx.strokeStyle = '#ecf0f1'; vCtx.lineWidth = 1;
            let step = limit > 30 ? 5 : (limit > 15 ? 2 : 1);
            for (let i = 0; i <= width / 2; i += scale * step) {
                vCtx.beginPath(); vCtx.moveTo(width/2 + i, 0); vCtx.lineTo(width/2 + i, height); vCtx.stroke();
                vCtx.beginPath(); vCtx.moveTo(width/2 - i, 0); vCtx.lineTo(width/2 - i, height); vCtx.stroke();
                vCtx.beginPath(); vCtx.moveTo(0, height/2 + i); vCtx.lineTo(width, height/2 + i); vCtx.stroke();
                vCtx.beginPath(); vCtx.moveTo(0, height/2 - i); vCtx.lineTo(width, height/2 - i); vCtx.stroke();
            }
            vCtx.strokeStyle = '#bdc3c7'; vCtx.lineWidth = 2;
            vCtx.beginPath(); vCtx.moveTo(width/2, 0); vCtx.lineTo(width/2, height); vCtx.stroke();
            vCtx.beginPath(); vCtx.moveTo(0, height/2); vCtx.lineTo(width, height/2); vCtx.stroke();

            function plot(x, y, label, strLabel, color, isTop) {
                let cx = width/2 + (x * scale); let cy = height/2 - (y * scale);
                vCtx.fillStyle = color; vCtx.beginPath(); vCtx.arc(cx, cy, 6, 0, 2*Math.PI); vCtx.fill();
                vCtx.fillStyle = '#2c3e50'; vCtx.font = "bold 14px Arial";
                let text = strLabel ? `${label}(${strLabel})` : `${label}(${x}, ${y})`;
                vCtx.fillText(text, cx + 8, cy + (isTop ? -12 : 24));
                return {cx, cy};
            }

            if (state.currentSkill === 1 || state.currentSkill === 3) {
                let {x1, y1, x2, y2, label1, label2, isTypeB, x1_str, y1_str, x2_str, y2_str} = state.qData;
                let p1IsTop = y1 >= y2;
                let l1 = label1 || 'A'; let l2 = label2 || 'B';
                let p1 = plot(x1, y1, l1, isTypeB ? `${x1_str}, ${y1_str}` : '', '#e74c3c', p1IsTop);
                let p2 = plot(x2, y2, l2, isTypeB ? `${x2_str}, ${y2_str}` : '', '#3498db', !p1IsTop);
                vCtx.strokeStyle = '#2ecc71'; vCtx.lineWidth = 2; vCtx.setLineDash([5, 5]);
                vCtx.beginPath(); vCtx.moveTo(p1.cx, p1.cy); vCtx.lineTo(p2.cx, p2.cy); vCtx.stroke(); vCtx.setLineDash([]);
            } else if (state.currentSkill === 2) {
                let q = state.qData;
                function drawL(mStr, cStr, color, dashed=false) {
                    let m = evalFracStr(mStr), c = evalFracStr(cStr);
                    let cx1 = width/2 + (-limit * scale); let cy1 = height/2 - ((m * -limit + c) * scale);
                    let cx2 = width/2 + (limit * scale);  let cy2 = height/2 - ((m * limit + c) * scale);
                    vCtx.strokeStyle = color; vCtx.lineWidth = 2; if (dashed) vCtx.setLineDash([5, 5]);
                    vCtx.beginPath(); vCtx.moveTo(cx1, cy1); vCtx.lineTo(cx2, cy2); vCtx.stroke(); vCtx.setLineDash([]);
                }
                
                if (q.type === 1) {
                    drawL(q.m_str, q.c_str, '#2ecc71'); plot(0, evalFracStr(q.c_str), 'y-int', '', '#3498db', true);
                } else if (q.type === 2) {
                    drawL(q.m_str, q.c_str, '#2ecc71'); plot(q.x1, q.y1, 'P', '', '#e74c3c', true);
                } else if (q.type === 3) {
                    drawL(q.m_str, q.c_str, '#2ecc71'); plot(q.x1, q.y1, 'A', '', '#3498db', true); plot(q.x2, q.y2, 'B', '', '#3498db', false);
                } else if (q.type === 4) {
                    drawL(`${-q.B/q.A}`, `${q.C/q.A}`, '#bdc3c7'); plot(q.x1, q.y1, 'P', '', '#e74c3c', true); drawL(q.m2_str, q.c_str, '#2ecc71', true); 
                }

                if (q.type) {
                    vCtx.fillStyle = '#2c3e50'; vCtx.font = "bold 16px Arial";
                    if (q.type === 4) vCtx.fillText(`${q.displayLineStrRaw || ''}`, 10, 25);
                    else if (q.type !== 3) vCtx.fillText(`m = ${q.m_str}`, 10, 25);
                }
            } else if (state.currentSkill === 4) {
                let viz = state.qData.vizData;
                
                if (!viz || !viz.type) {
                    vCtx.fillStyle = '#2c3e50'; vCtx.font = "italic 16px Arial";
                    vCtx.fillText("No visual representation for this question.", 10, 25);
                    return;
                }

                function drawSkill4Line(m, c, color, label, isVertical = false, xVal = 0) {
                    vCtx.strokeStyle = color; vCtx.lineWidth = 2;
                    vCtx.beginPath();
                    if (isVertical) {
                        let cx = width/2 + (xVal * scale);
                        vCtx.moveTo(cx, 0); vCtx.lineTo(cx, height);
                    } else {
                        let cx1 = width/2 + (-limit * scale); let cy1 = height/2 - ((m * -limit + c) * scale);
                        let cx2 = width/2 + (limit * scale);  let cy2 = height/2 - ((m * limit + c) * scale);
                        vCtx.moveTo(cx1, cy1); vCtx.lineTo(cx2, cy2);
                    }
                    vCtx.stroke();
                    if (label) {
                        vCtx.fillStyle = '#2c3e50'; vCtx.font = "bold 16px Arial";
                        vCtx.fillText(label, 10, 25);
                    }
                }

                if (viz.type === 'collinear') {
                    let m = Math.floor(Math.random() * 3) - 1; 
                    let c = Math.floor(Math.random() * 5) - 2; 
                    drawSkill4Line(m, c, '#3498db');
                    
                    let x1 = Math.floor(Math.random() * 3) - 4; 
                    let x2 = Math.floor(Math.random() * 3) - 1; 
                    let x3 = Math.floor(Math.random() * 3) + 2; 
                    
                    plot(x1, m * x1 + c, 'A', '', '#e74c3c', true);
                    plot(x2, m * x2 + c, 'B', '', '#e74c3c', true);
                    plot(x3, m * x3 + c, 'C', '', '#e74c3c', true);
                } 
                else if (viz.type === 'eq_only') {
                    drawSkill4Line(viz.m, viz.c, '#3498db', viz.label, viz.isVertical, viz.xVal);
                } 
                else if (viz.type === 'random_horiz_line') {
                    let yVal = Math.floor(Math.random() * 9) - 4; 
                    drawSkill4Line(0, yVal, '#3498db', `y = ${yVal}`);
                }
                else if (viz.type === 'random_vert_line') {
                    let xVal = Math.floor(Math.random() * 9) - 4; 
                    drawSkill4Line(0, 0, '#3498db', `x = ${xVal}`, true, xVal);
                }
                else if (viz.type === 'random_point_on_horiz') {
                    drawSkill4Line(0, viz.yVal, '#3498db', `y = ${viz.yVal}`);
                    let px = Math.floor(Math.random() * 11) - 5;
                    plot(px, viz.yVal, 'P', '', '#e74c3c', true);
                }
                else if (viz.type === 'random_point_on_vert') {
                    drawSkill4Line(0, 0, '#3498db', `x = ${viz.xVal}`, true, viz.xVal);
                    let py = Math.floor(Math.random() * 11) - 5;
                    plot(viz.xVal, py, 'P', '', '#e74c3c', true);
                }
                else if (viz.type === 'line_point') {
                    drawSkill4Line(viz.m, viz.c, '#3498db');
                    plot(viz.px, viz.py, 'P', '', '#e74c3c', true);
                } 
                else if (viz.type === 'line_point_vert') {
                    drawSkill4Line(0, 0, '#3498db', null, true, viz.xVal);
                    plot(viz.px, viz.py, 'P', '', '#e74c3c', true);
                } 
                else if (viz.type === 'y-axis') {
                    vCtx.strokeStyle = '#3498db'; vCtx.lineWidth = 3;
                    vCtx.beginPath(); vCtx.moveTo(width/2, 0); vCtx.lineTo(width/2, height); vCtx.stroke();
                    
                    let r1, r2;
                    do { 
                        r1 = Math.floor(Math.random() * 11) - 5; 
                        r2 = Math.floor(Math.random() * 11) - 5; 
                    } while (r1 === r2 || r1 === 0 || r2 === 0);
                    
                    plot(0, r1, 'P1', '', '#e74c3c', true);
                    plot(0, r2, 'P2', '', '#e74c3c', true);
                } 
                else if (viz.type === 'x-axis') {
                    vCtx.strokeStyle = '#3498db'; vCtx.lineWidth = 3;
                    vCtx.beginPath(); vCtx.moveTo(0, height/2); vCtx.lineTo(width, height/2); vCtx.stroke();
                    
                    let r1, r2;
                    do { 
                        r1 = Math.floor(Math.random() * 11) - 5; 
                        r2 = Math.floor(Math.random() * 11) - 5; 
                    } while (r1 === r2 || r1 === 0 || r2 === 0);
                    
                    plot(r1, 0, 'P1', '', '#e74c3c', true);
                    plot(r2, 0, 'P2', '', '#e74c3c', true);
                }
            }
        }

        // --- Stylus Annotation ---
        const canvas = document.getElementById('draw-layer'); const ctx = canvas.getContext('2d'); window.drawCtx = ctx; 
        let isDrawing = false; let currentTool = 'cursor';

        function resizeCanvas() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; }

        function initDrawing() {
            window.addEventListener('resize', resizeCanvas);
            const preventScroll = (e) => { if (currentTool !== 'cursor') e.preventDefault(); };
            canvas.addEventListener('touchstart', preventScroll, { passive: false }); canvas.addEventListener('touchmove', preventScroll, { passive: false });
            canvas.addEventListener('pointerdown', (e) => {
                if (currentTool === 'cursor') return;
                isDrawing = true; const rect = canvas.getBoundingClientRect(); ctx.beginPath(); ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            });
            canvas.addEventListener('pointermove', (e) => {
                if (!isDrawing) return;
                const rect = canvas.getBoundingClientRect();
                ctx.lineWidth = currentTool === 'erase' ? 25 : 3 * (e.pressure > 0 ? e.pressure * 2 : 1);
                ctx.lineCap = 'round'; ctx.strokeStyle = currentTool === 'erase' ? '#ffffff' : '#e74c3c';
                ctx.globalCompositeOperation = currentTool === 'erase' ? "destination-out" : "source-over";
                ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top); ctx.stroke();
            });
            const stopDrawing = () => { isDrawing = false; };
            canvas.addEventListener('pointerup', stopDrawing); canvas.addEventListener('pointercancel', stopDrawing); canvas.addEventListener('pointerout', stopDrawing);

            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (btn.id === 'tool-clear') { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
                    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
                    currentTool = btn.id.replace('tool-', ''); canvas.classList.toggle('active', currentTool !== 'cursor');
                });
            });
            document.getElementById('tool-cursor').classList.add('active');
        }

        // --- Initialization ---
        function init() {
            initDrawing();
            document.querySelectorAll('.menu-btn:not([disabled])').forEach(btn => btn.addEventListener('click', startSkill));
            document.getElementById('btn-menu').addEventListener('click', showMenu);
            document.getElementById('scaffold-toggle').addEventListener('change', () => { state.scaffold = document.getElementById('scaffold-toggle').checked; updateLayout(); });
            document.getElementById('btn-next').addEventListener('click', generateQuestion);
            document.getElementById('btn-visualise').addEventListener('click', openVisualise);
            document.getElementById('btn-close-viz').addEventListener('click', () => document.getElementById('viz-modal').classList.add('hidden'));

            document.getElementById('left-col').addEventListener('pointerdown', (e) => {
                const targetSub = e.target.closest('.frac-num, .frac-den');
                const targetBox = e.target.closest('.input-box');
                
                if (targetSub && targetBox) {
                    e.stopPropagation();
                    let sub = targetSub.classList.contains('frac-num') ? 'num' : 'den';
                    setActiveInput(targetBox.dataset.id, sub);
                } else if (targetBox) {
                    e.stopPropagation();
                    setActiveInput(targetBox.dataset.id);
                }
            });

            document.querySelectorAll('.key').forEach(btn => {
                const handler = (e) => {
                    e.preventDefault(); 
                    if (btn.id === 'btn-next') return; 
                    if (btn.id === 'btn-submit') checkAnswers();
                    else if (btn.classList.contains('frac-btn')) toggleFraction();
                    else if (btn.classList.contains('undef-btn')) {
                        state.inputs[state.activeInputId].type = 'text'; state.inputs[state.activeInputId].val = 'undefined'; renderInputDisplay(state.activeInputId);
                    }
                    else handleKeyPress(btn.textContent.trim());
                };
                btn.addEventListener('pointerdown', handler);
            });

            document.getElementById('right-col').addEventListener('touchmove', e => e.preventDefault(), {passive:false});
        }
        init();
    </script>
</body>
</html>
